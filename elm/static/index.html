<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mika Job Dashboard</title>
<link rel="icon" href="/mika-icon.png" type="image/png">
<style>
:root{
  --bg:#F7F9FD; --surface:#FFFFFF; --surface-2:#EEF3FA; --line:#D8E0EC;
  --ink:#12203A; --ink-2:#3E4C66; --ink-3:#55627A;
  --accent:#0F4D92; --sable:#E8A33D; --sable-soft:#FFF3DC;
  --acad:#1757B8; --acad-bg:#E4EEFD; --rec:#C4500F; --rec-bg:#FFEBDD; --camp:#0E8355; --camp-bg:#DFF6EA;
  --warn:#C0271A; --warn-bg:#FFE9E6;
  --display:"Yale 2024","YaleNew",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(18,32,58,.06),0 8px 22px rgba(18,32,58,.07);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:radial-gradient(900px 420px at 0% 0%,#DDEAFF 0,rgba(221,234,255,0) 70%),radial-gradient(800px 380px at 100% 0%,#FFE9CC 0,rgba(255,233,204,0) 70%),var(--bg) no-repeat;color:var(--ink);font:16px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sable);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--ink-3);font-size:14px}
h2{font:700 21px/1.2 var(--display);margin:0}
.bar{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#0F4D92,#286DC0);color:#fff;box-shadow:var(--shadow)}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{font:700 24px/1.1 var(--display)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{white-space:nowrap;border:0;background:none;color:#fff;opacity:.8;font-weight:650;padding:8px 14px;border-radius:999px}
.nav button[aria-selected="true"]{background:rgba(255,255,255,.2);opacity:1}
.sp-fill{flex:1}
.bar .lang{border:1.5px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:6px 14px;font-weight:650;white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 28px}
.lead{margin:0 0 14px;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:650;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:5px 12px;font-size:14px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.filters{padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.qrow{flex-wrap:nowrap;gap:8px}.qrow select{flex:0 1 230px;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
@media (max-width:560px){.qrow{flex-wrap:wrap}.qrow select{flex:1 1 100%}}
.filters input[type=search]{width:100%;flex:1;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tog{font-size:14px;font-weight:650;color:var(--ink-2);border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px}
.tog[aria-pressed="true"]{background:linear-gradient(120deg,#0F4D92,#2F7BE5);border-color:#1F63C4;color:#fff;box-shadow:0 3px 10px rgba(31,99,196,.28)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:1fr;gap:16px}}
.role{padding:14px 16px;margin-bottom:12px;border-left:5px solid var(--line);transition:transform .15s ease,box-shadow .15s ease}
.role[data-k=intern]{border-left-color:#F08A3C}.role[data-k=entry]{border-left-color:#2F7BE5}.role[data-k=startup]{border-left-color:#18A56A}.role[data-k=coop]{border-left-color:#8B5CF6}
.chip.coop{color:#6D3FD6;background:#F1EBFF;border-color:#D6C7FB}
@media (hover:hover){.role:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(18,32,58,.13)}}
.fhd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}.fhd h2{color:var(--accent)}
.role h3{margin:0;font:700 18px/1.3 var(--sans)}
.role .co{color:var(--ink-2);font-weight:650}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{font-size:14px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.chip.intern{color:var(--rec);background:var(--rec-bg);border-color:#F3C7A8}
.chip.entry{color:var(--acad);background:var(--acad-bg);border-color:#BCD3F5}
.chip.startup{color:var(--camp);background:var(--camp-bg);border-color:#A9DCC0}
.sp.sponsored{font-size:11.5px;font-weight:700;color:#0A6B3B;background:#DCF3E6;border:1px solid #A9DCC0;border-radius:999px;padding:1px 8px;white-space:nowrap}
.quote{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--sable);background:var(--sable-soft);border-radius:0 10px 10px 0;font-size:14px;color:var(--ink-2)}
.quote.no{border-color:var(--warn);background:var(--warn-bg)}
.apply .btn:not(.ghost){background:linear-gradient(120deg,#0F4D92,#2F7BE5);box-shadow:0 3px 10px rgba(31,99,196,.25)}
.apply{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.legend{padding:12px 16px;margin-bottom:16px;font-size:14px;color:var(--ink-2)}
.legend p{margin:6px 0 0}
.stripe{display:inline-block;border-left:5px solid;padding:0 6px;font-weight:650;color:var(--ink-2)}
.side .card{padding:14px 16px;margin-bottom:14px}
.side p{margin:6px 0 10px;color:var(--ink-2);font-size:15px}
.more{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;color:var(--accent);font-weight:600;margin-bottom:12px}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3)}
.foot{max-width:1120px;margin:0 auto;padding:0 18px 110px;color:var(--ink-3);font-size:14px;line-height:1.6}
.ev{padding:12px 16px;margin-bottom:10px}
.ev b{display:block}.ev{overflow-wrap:anywhere}
/* chat */
/* the chat button is Mika's: Mika peeks from the right edge; the label slides out on hover or focus */
.fab{position:fixed;right:0;bottom:84px;z-index:20;border:0;border-radius:999px 0 0 999px;background:#fff;box-shadow:0 4px 18px rgba(18,32,58,.22);padding:5px 8px 5px 6px;display:flex;align-items:center;gap:0;font-weight:700;color:var(--ink);transform:translateX(22px);transition:transform .18s ease}
.fab .mika{width:58px;height:44px}
.fab span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .18s ease,margin .18s ease}
.fab:hover,.fab:focus-visible{transform:none}
.fab:hover span,.fab:focus-visible span{max-width:140px;margin:0 8px 0 6px}
@media (hover:none){.fab{transform:translateX(14px)}}
/* the chat window is Mika SOM's: Mika bowing in the header, display-font title, plain × close, bubbles with a tail corner */
.chat{position:fixed;right:20px;bottom:20px;z-index:30;width:min(400px,calc(100vw - 24px));height:min(620px,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:0 12px 48px rgba(18,32,58,.35);overflow:hidden}
@media (max-width:560px){.chat{left:8px;right:8px;bottom:8px;width:auto;height:calc(100dvh - 72px);max-height:none}}
.chat-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:linear-gradient(120deg,#0F4D92,#286DC0);font:700 19px var(--display)}
.chat-hd .mika{width:40px;height:40px}
.chat-hd #chatX{margin-left:auto;border:0;background:none;color:#fff;font-size:24px;line-height:1;width:auto;height:auto;padding:2px 4px}
.xclose{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--ink-2);font-size:16px;line-height:1}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:140px}
.m{padding:10px 14px;border-radius:18px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.m.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.m.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px}
.chat .note{padding:0 12px 8px;font-size:12px;color:var(--ink-3)}
/* interests, sort, feedback */
.int{padding:14px 16px;margin-bottom:16px;position:relative}
.int h2{padding-right:40px}
.int .xclose{position:absolute;top:10px;right:10px}
.int label.f,.int .f{display:block;font-weight:650;margin:12px 0 6px;color:var(--ink-2)}
.int select,.int input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.int .acts{margin-top:14px}
.int .toggles{gap:6px}.int .tog{font-size:13.5px;padding:3px 11px}
.int .exsum{font-size:14.5px;margin:0 0 6px}
.sortrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sortrow select{padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:650;color:var(--ink-2)}
.linkbtn{border:0;background:none;color:var(--ink-3);font-size:13px;text-decoration:underline;padding:2px 4px}
.why{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
.thumbs{display:flex;gap:4px}
.thumb{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:14px;line-height:1;padding:5px 9px;opacity:.75}
.thumb:hover{opacity:1}
.thumb[aria-pressed="true"]{opacity:1;background:var(--acad-bg);border-color:#BCD3F5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:40;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--sable);font-weight:700;padding:0}
.iv{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:10px}
.iv .msgs{max-height:220px;min-height:0;padding:0 0 8px}
.chip.x{cursor:pointer;background:var(--acad-bg);border-color:#BCD3F5;color:var(--acad)}
.chip.x::after{content:" ✕";font-size:12px}
.chip.neg{background:var(--warn-bg);border-color:#F5B9B2;color:var(--warn)}
@media (max-width:520px){.nav button{padding:8px 9px}.bar-in{gap:8px;padding:8px 12px}.logo{font-size:19px}.wrap{padding:16px 12px}}
@media (max-width:440px){.nav button{padding:7px 6px;font-size:14px}.bar-in{gap:6px;padding:8px 8px}.logo{font-size:16px}.lang{padding:5px 9px;font-size:13px}}
/* mascot, hero, quote of the day */
.mika{object-fit:contain;display:block}
.logo{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}.logo .mika{width:42px;height:42px}   /* Mika's app icon (head and blue scarf), drawn for small sizes and dark bars */
.lg-short{display:none}@media (max-width:720px){.lg-full{display:none}.lg-short{display:inline}}@media (max-width:430px){.lg-short{display:none}}
.hero{display:flex;gap:20px;align-items:center;padding:18px 24px;border-radius:22px;margin-bottom:18px;background:linear-gradient(120deg,#D6E6FF,#EEF5FF 55%,#FFE5BF);border:1px solid #CBDAF0;box-shadow:var(--shadow)}
.hero .mika{width:104px;height:104px;flex:none;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.hero .mika.pop{animation:pop .35s ease-out 1}}
@keyframes pop{0%{transform:scale(.94) translateY(3px)}60%{transform:scale(1.05) translateY(-4px)}100%{transform:none}}
.hero-nm{font:700 26px/1.1 var(--display);color:var(--accent)}
.hero .lead{margin:6px 0 0}
.dq{margin:12px 0 0;padding:8px 12px;border-left:3px solid var(--sable);background:var(--sable-soft);border-radius:0 10px 10px 0;color:var(--ink);max-width:70ch}
.dq q{font:650 17px/1.45 var(--sans);quotes:"“" "”"} .dq .by{display:block;margin-top:4px;font-size:14px;color:var(--ink-2)} .dq .orig{display:block;font-size:13px;color:var(--ink-3);font-style:italic}
.dq .occ{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rec);background:var(--rec-bg);border-radius:999px;padding:1px 9px;margin-bottom:4px}
@media (max-width:640px){.hero{padding:14px;gap:12px}.hero .mika{width:64px;height:64px}.hero-nm{font-size:21px}}
.empty .mika{width:84px;height:84px;margin:0 auto 8px}
.cards{display:flex;flex-direction:column;gap:8px;align-self:stretch}.cards .role{margin:0;padding:10px 12px}.cards .role h3{font-size:16px}
.m .mika{width:44px;height:44px;margin-bottom:4px}
.chip.found{color:#B0306A;background:#FDE8F1;border-color:#F4BCD5}   /* pink: purple is the co-op colour */
.hideline{padding:10px 16px;margin-bottom:12px;font-size:14.5px;color:var(--ink-2);background:var(--sable-soft);border:1px solid #F2D9A8;border-radius:12px}
.find{padding:14px 16px;margin-bottom:12px}.find .row{margin-top:8px}.find input[type=text]{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px}
.ex .chip.x.neg{cursor:pointer}
.save{border:1.5px solid var(--line);background:#fff;border-radius:999px;font-size:13.5px;font-weight:650;padding:4px 11px;color:var(--ink-2)}
.save[aria-pressed="true"]{background:var(--sable-soft);border-color:var(--sable);color:var(--ink)}
.app{padding:12px 14px;margin-bottom:10px}.app h3{margin:0;font:700 17px/1.3 var(--sans)}
.app .row{margin-top:8px}.app select,.app input,.app textarea{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
.app textarea{flex:1;min-width:180px;resize:vertical}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.stg .chip b{margin-left:4px}
.chip.gone{color:var(--warn);background:var(--warn-bg);border-color:#F5B9B2}
.footlinks a{margin-right:12px}
@media (max-width:520px){.hero-nm{font-size:19px}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="logo" id="logo" title="Mika Job Dashboard"><img class="mika" src="/mika-icon.png" alt="Mika Job Dashboard"><span class="lg-full">Mika Job Dashboard</span><span class="lg-short">Mika Jobs</span></div>
  <nav class="nav" role="tablist"><button type="button" role="tab" id="tabJobs" aria-selected="true"></button><button type="button" role="tab" id="tabEvents" aria-selected="false"></button><button type="button" role="tab" id="tabApps" aria-selected="false"></button></nav>
  <div class="sp-fill"></div>
  <button type="button" class="lang" id="lang"></button>
</div></header>

<main class="wrap">
  <div class="hero"><img class="mika" id="heroMika" src="/mika/sit.webp" alt="">
    <div><div class="hero-nm" id="heroNm">Mika Job Dashboard</div><p class="lead" id="lead"></p>
    <div class="dq" id="dq" hidden><span class="occ" id="dqOcc" hidden></span><q id="dqText"></q><span class="orig" id="dqOrig" hidden></span><span class="by"><span id="dqBy"></span> <a id="dqSrc" target="_blank" rel="noopener noreferrer"></a></span></div></div></div>
  <section id="jobsView">
    <div class="cols"><div>
      <div class="card int" id="intCard" hidden>
        <button type="button" class="xclose" id="intX" aria-label="Close">✕</button>
        <h2 id="intT"></h2><p class="muted" id="intP"></p>
        <div class="f" id="intKindL"></div><div class="toggles" id="intKind"></div>
        <div class="f" id="intMajorL"></div>
        <div class="toggles" id="intMajors"></div><div class="row" style="margin-top:6px"><select id="intMajor" style="flex:1;min-width:0"></select></div>
        <div class="row" id="intMajorOther" hidden style="margin-top:6px"><input type="text" id="intMajorTx" maxlength="60" autocomplete="off" style="flex:1;min-width:0"><button type="button" class="btn sm" id="intMajorAdd"></button></div>
        <div class="f" id="intChipsL"></div><div class="toggles" id="intChips"></div>
        <input type="text" id="intText" maxlength="80" autocomplete="off">
        <div class="f" id="intExL"></div><p class="muted exsum" id="intExSum"></p><div id="intExBox" hidden><p class="muted" id="intExP" style="margin:0 0 6px"></p><div class="toggles ex" id="intEx"></div></div>
        <div id="intExtra" class="muted" style="margin-top:8px"></div>
        <label class="f" style="font-weight:500"><input type="checkbox" id="intVisa"> <span id="intVisaL"></span></label>
        <p class="muted" id="intVisaN" style="margin:0"></p>
        <div class="row acts"><button type="button" class="btn sm" id="intSave"></button><button type="button" class="btn ghost sm" id="intTell"></button></div>
        <div class="iv" id="iv" hidden>
          <div class="msgs" id="ivMsgs" aria-live="polite"></div>
          <p class="muted" id="ivNote" style="margin:0 0 6px"></p>
          <form id="ivForm" class="row"><input type="text" id="ivIn" maxlength="500" autocomplete="off" style="flex:1;min-width:0;margin:0"><button class="btn sm" id="ivSend"></button></form>
          <div id="ivProf" hidden></div>
        </div>
      </div>
      <div class="card filters">
        <div class="fhd"><h2 id="fT"></h2><span class="muted" id="fN" aria-live="polite"></span></div>
        <div class="row qrow"><input type="search" id="q" maxlength="100" autocomplete="off"><select id="place"></select></div>
        <div class="toggles" id="toggles"></div>
        <div class="sortrow"><div class="row"><button type="button" class="btn ghost sm" id="intBtn"></button>
          <select id="sort" aria-label="Sort"></select></div>
          <span id="resetBox"><button type="button" class="linkbtn" id="resetL"></button></span></div>
      </div>
      <div class="card legend" id="legend"></div>
      <div id="hideLine" class="hideline" hidden></div>
      <div id="roles"></div>
      <button type="button" class="more" id="more" hidden></button>
      <div class="card find" id="findCard"><h2 id="findT"></h2><p class="muted" id="findP" style="margin:4px 0 0"></p>
        <form class="row" id="findForm"><input type="text" id="webQ" maxlength="200" autocomplete="off"><button class="btn sm" id="webGo"></button></form>
        <p class="muted" id="webMsg" style="margin:8px 0 0" aria-live="polite"></p><div id="webAsk" hidden class="row"><button type="button" class="btn ghost sm" id="webReq"></button></div><div id="webRes" style="margin-top:10px"></div></div>
    </div>
    <aside class="side">
      <div class="card"><h2 id="stT"></h2><p id="stP"></p><a class="btn ghost sm" id="stA" href="https://tsaicity.useplop.com/" target="_blank" rel="noopener noreferrer"></a></div>
      <div class="card"><h2 id="somT"></h2><p id="somP"></p><a class="btn ghost sm" id="somA" href="https://mika-som.onrender.com" target="_blank" rel="noopener noreferrer"></a></div>
    </aside></div>
  </section>
  <section id="eventsView" hidden><div id="events"></div></section>
  <section id="appsView" hidden><div class="card" style="padding:12px 16px;margin-bottom:12px"><h2 id="appsT"></h2><p class="muted" id="appsP" style="margin:4px 0 8px"></p>
    <div class="stg" id="appsLegend"></div>
    <div class="row"><button type="button" class="btn ghost sm" id="csvOut"></button><button type="button" class="btn ghost sm" id="csvInB"></button><input type="file" id="csvIn" accept=".csv,text/csv" hidden></div></div>
    <div id="apps"></div></section>
</main>
<div class="foot" id="foot"></div>
<div class="toast" id="toast" hidden role="status"></div>

<button type="button" class="fab" id="chatOpen"><img class="mika" src="/mika/peek.webp" alt=""><span id="chatOpenT"></span></button>
<div class="chat" id="chat" hidden role="dialog" aria-modal="false">
  <div class="chat-hd"><img class="mika" src="/mika/bow.webp" alt=""><span id="chatT"></span><button type="button" id="chatX" aria-label="Close">×</button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="note" id="chatNote"></div>
  <form id="chatForm"><input id="chatIn" maxlength="500" autocomplete="off"><button class="btn sm" id="chatSend"></button></form>
</div>

<script id="rankjs">
/* RANK-BEGIN: pure scoring code, no DOM; elm/tests/test_rank.mjs evaluates this block. */
const Rank = (function(){
  const CHIPS = [
    {id:"swe",en:"Software engineering",zh:"软件工程",kw:["software","engineer","developer","backend","frontend","full stack","fullstack"]},
    {id:"hwe",en:"Hardware engineering",zh:"硬件工程",kw:["hardware","embedded","firmware","silicon","chip","asic","fpga"]},
    {id:"ee",en:"Electrical engineering",zh:"电气工程",kw:["electrical","electronics","circuit","power systems","signal"]},

    {id:"arts",en:"Arts / Museums",zh:"艺术 / 博物馆",kw:["museum","curator","gallery","archive","arts","collections"]}

  const MAJORS = [

    {id:"stats",g:"comp",en:"Statistics & Data Science",zh:"统计与数据科学",chips:["data","ml","quant","investing"]},
    {id:"appmath",g:"comp",en:"Applied Mathematics",zh:"应用数学",chips:["quant","data","ml","finance"]},
    {id:"ee",g:"eng",en:"Electrical Engineering",zh:"电气工程",chips:["ee","hwe","swe"]},
    {id:"me",g:"eng",en:"Mechanical Engineering",zh:"机械工程",chips:["mech","hwe"]},
    {id:"cheme",g:"eng",en:"Chemical Engineering",zh:"化学工程",chips:["chem","sustain","ops"]},
    {id:"bme",g:"eng",en:"Biomedical Engineering",zh:"生物医学工程",chips:["bio","health","hwe"]},
    {id:"enveng",g:"eng",en:"Environmental Engineering",zh:"环境工程",chips:["sustain","chem"]},
    {id:"physics",g:"sci",en:"Physics",zh:"物理",chips:["hwe","quant","ml"]},
    {id:"chem",g:"sci",en:"Chemistry",zh:"化学",chips:["chem","bio"]},
    {id:"bio",g:"sci",en:"MB&B / Biology",zh:"分子生物 / 生物学",chips:["bio","health"]},
    {id:"envs",g:"sci",en:"Environmental Studies / Forestry",zh:"环境研究 / 林学",chips:["sustain","policy"]},
    {id:"ph",g:"soc",en:"Public Health",zh:"公共卫生",chips:["health","policy","data"]},
    {id:"econ",g:"soc",en:"Economics",zh:"经济学",chips:["finance","consulting","investing","data","policy"]},
    {id:"gapol",g:"soc",en:"Global Affairs / Political Science",zh:"全球事务 / 政治学",chips:["policy","consulting","law"]},
    {id:"psych",g:"soc",en:"Psychology",zh:"心理学",chips:["health","edu","marketing","data"]},
    {id:"law",g:"soc",en:"Law",zh:"法学",chips:["law","policy"]},
    {id:"hum",g:"hum",en:"History / English / Humanities",zh:"历史 / 英语 / 人文",chips:["media","edu","arts","policy"]},
    {id:"arch",g:"hum",en:"Architecture / Art",zh:"建筑 / 艺术",chips:["design","arts"]},
    {id:"other",g:"other",en:"Other",zh:"其他",chips:[]}
  ];
  /* Chips that are likely irrelevant for each major: PROPOSED as "hide", the student edits them. "Other" proposes nothing. */
  const T8 = ["swe","hwe","ee","mech","bio","chem","ml","quant"], SOFT = ["arts","law","edu","media"];
  const EX = {cs:["mech","chem","bio","health",...SOFT], stats:["mech","chem","hwe","ee",...SOFT], appmath:["bio","chem","health",...SOFT],
    ee:["bio","chem","policy","health","marketing",...SOFT], me:["bio","policy","health","marketing","quant","investing",...SOFT],
    cheme:["swe","hwe","ee","marketing","quant",...SOFT], bme:["marketing","quant","investing","sales",...SOFT], enveng:["swe","hwe","marketing","quant","investing","sales",...SOFT],
    physics:["marketing","sales","policy","health",...SOFT], chem:["swe","hwe","ee","marketing","quant","investing","sales",...SOFT],
    bio:["swe","hwe","ee","mech","marketing","quant","investing","sales",...SOFT], envs:["swe","hwe","ee","mech","chem","quant","investing","sales","law"],
    ph:["swe","hwe","ee","mech","chem","quant","investing","sales","arts"], econ:["hwe","ee","mech","bio","chem","edu","arts","media"],
    gapol:["swe","hwe","ee","mech","bio","chem","quant","ml","sales"], psych:["swe","hwe","ee","mech","chem","quant","investing","law"],
    law:["swe","hwe","ee","mech","bio","chem","ml","quant","design","sales"], hum:T8, arch:["swe","hwe","ee","bio","chem","ml","quant","investing","law","sales"], other:[]};
  MAJORS.forEach(m=>{ m.ex = EX[m.id]||[]; });
  const STOP = new Set(["the","and","for","with","intern","internship","entry","level","junior","senior","summer","fall","spring","winter","new","grad","graduate","associate","new grad","ii","iii","remote","hybrid","full","time","part","contract","team","our"]);
  const norm = s => " " + String(s||"").toLowerCase().replace(/[^\p{L}\p{N}+#]+/gu, " ").trim() + " ";
  function has(hay, kw){            // whole-word match; longer words also match as a prefix (engineer ~ engineers)
    const k = String(kw).toLowerCase().trim(); if(!k) return false;
    return k.length <= 3 ? hay.includes(" "+k+" ") : hay.includes(" "+k);
  }
  function words(title){ return norm(title).trim().split(" ").filter(w=>w.length>=3 && !/^\d+$/.test(w) && !STOP.has(w)); }
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const chipById = id => CHIPS.find(c=>c.id===id);
  /* majors: [{id, text?}] (up to 3). Related chips are the UNION over the majors; a typed "Other" major is matched word by word
     against the chip keyword lists and nothing is guessed when no word matches. */
  const majorList = P => (Array.isArray(P&&P.majors)?P.majors:[]).map(m=>typeof m==="string"?{id:m}:m).filter(m=>m&&MAJORS.some(x=>x.id===m.id)).slice(0,3);
  function otherChips(text){
    const hay = norm(text), out = [];
    for(const c of CHIPS) if(c.kw.some(k=>has(hay,k))) out.push(c.id);
    return out;
  }
  function relatedChips(P){
    const out = [];
    for(const m of majorList(P)){
      const base = m.id==="other" ? otherChips(m.text||"") : (MAJORS.find(x=>x.id===m.id).chips);
      base.forEach(c=>{ if(!out.some(o=>o.chip===c)) out.push({chip:c, major:m.id}); });
    }
    return out;
  }
  function suggestExclude(majors){
    const ms = majorList({majors}); if(!ms.length) return [];
    let ex = null;
    for(const m of ms){ const e = MAJORS.find(x=>x.id===m.id).ex; ex = ex===null ? e.slice() : ex.filter(c=>e.includes(c)); }
    const keep = new Set(relatedChips({majors:ms}).map(o=>o.chip));
    return ex.filter(c=>!keep.has(c));
  }
  const roleChips = r => { const h = norm(r.title); return CHIPS.filter(c=>c.kw.some(k=>has(h,k))).map(c=>c.id); };
  /* a role is hidden only when its title matches chips and ALL of them are excluded (and none picked, no keyword hit) */
  function isHidden(r, P){
    const ex = (P&&P.exclude)||[]; if(!ex.length) return false;
    const m = roleChips(r); if(!m.length) return false;
    const picked = new Set((P.chips)||[]); if(m.some(c=>picked.has(c)||!ex.includes(c))) return false;
    const h = norm(r.title);
    return !([...(P.keywords||[]), ...String(P.text||"").split(/[,;\n]+/)].map(x=>x.trim()).filter(x=>x.length>=2).some(k=>has(h,k)));
  }
  function split(roles, P, showAll){
    const hidden = roles.filter(r=>isHidden(r,P));
    return {show: showAll ? roles : roles.filter(r=>!hidden.includes(r)), hidden};
  }
  const hasSponsor = r => { const s=r.sponsor; return !!(s && typeof s==="object" && (s.lca_recent||s.lca_total)); };

  /* P: {kind:"intern|entry|both|", majors:[{id,text?}], exclude[], chips[], text, keywords[], avoid[], locations[], visa}
     Lr: {co:{company:w}, w:{word:w}, st:number, t:ms}.  Returns {score, why:[{k,...}], liked:company|null} */
  function score(r, P, Lr, now){
    P = P || {}; Lr = Lr || {co:{},w:{},st:0}; now = now || Date.now();
    const hay = norm(r.title), why = []; let s = 0;
    if((P.kind==="intern"||P.kind==="entry")){
      if(r.kind===P.kind){ s += 3; why.push({k:"kind",v:r.kind}); } else s -= 1.5;
    }
    const picked = new Set(P.chips||[]); let n = 0;
    for(const id of picked){
      const c = chipById(id); if(!c) continue;
      if(c.kw.some(k=>has(hay,k))){ s += 4; if(n++ < 2) why.push({k:"chip",id}); }
    }
    for(const o of relatedChips(P)){
      if(picked.has(o.chip)) continue;
      const c = chipById(o.chip);
      if(c && c.kw.some(k=>has(hay,k))){ s += 1.5; why.push({k:"major",id:o.major}); break; }
    }
    const kws = [...(P.keywords||[]), ...String(P.text||"").split(/[,;\n]+/)].map(x=>x.trim()).filter(x=>x.length>=2).slice(0,20);
    let kwHit = null;
    for(const k of kws) if(has(hay,k)){ s += 2.5; if(!kwHit){ kwHit=k; why.push({k:"kw",v:k}); } }
    for(const a of (P.avoid||[])) if(has(hay,a)){ s -= 6; break; }
    const loc = norm(r.location);
    for(const l of (P.locations||[])){ if(l && has(loc,l)){ s += 1.5; why.push({k:"loc",v:l}); break; } }
    if(P.visa && hasSponsor(r)){
      s += 2; why.push({k:"h1b"});
      const st = r.sponsor_text, v = st && typeof st==="object" ? st.verdict : st;
      if(v==="likely") s += 1;
    }
    if(r.tier==="startup"){ const b = clamp(Lr.st||0,-2,2); if(b){ s += b; if(b>=0.6) why.push({k:"startup"}); } }
    const co = (Lr.co||{})[String(r.company||"").toLowerCase()] || 0;
    s += clamp(co*1.5,-5,5);
    let ws = 0; for(const w of new Set(words(r.title))) ws += (Lr.w||{})[w]||0;
    s += clamp(ws,-3,3);
    if(r.posted){ const d=(now-Date.parse(r.posted))/864e5; if(d>=0 && d<14) s += 1*(1-d/14); }
    return {score:s, why:why.slice(0,4), liked: co>=1 ? r.company : null};
  }

  /* learning: kind up=+1, down=-1, apply=+0.7 (a negative sign undoes). Old weights fade (half-life 60 days); size is capped. */
  function decay(Lr, now){
    now = now || Date.now();
    const days = Lr.t ? Math.max(0,(now-Lr.t)/864e5) : 0, f = Math.pow(0.5, days/60);
    for(const m of ["co","w"]){
      const o = Lr[m] || {}; let e = Object.entries(o).map(([k,v])=>[k,v*f]).filter(([k,v])=>Math.abs(v)>=0.05);
      e.sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])); Lr[m] = Object.fromEntries(e.slice(0, m==="co"?150:300));
    }
    Lr.st = Math.abs((Lr.st||0)*f) < 0.05 ? 0 : (Lr.st||0)*f; Lr.t = now; return Lr;
  }
  const STRENGTH = {up:1, down:-1, apply:0.7};
  function learn(Lr, r, kind, sign, now){
    Lr = decay(Lr || {co:{},w:{},st:0}, now);
    const d = (STRENGTH[kind]||0) * (sign||1), co = String(r.company||"").toLowerCase();
    if(co) Lr.co[co] = clamp((Lr.co[co]||0)+d, -3, 3);
    for(const w of new Set(words(r.title))) Lr.w[w] = clamp((Lr.w[w]||0)+0.4*d, -2, 2);
    if(r.tier==="startup") Lr.st = clamp((Lr.st||0)+0.3*d, -2, 2);
    return decay(Lr, now);
  }
  function sortRoles(roles, P, Lr, mode, now){
    if(mode==="new") return roles.slice().sort((a,b)=>String(b.posted||"").localeCompare(String(a.posted||"")) || String(b.seen||"").localeCompare(String(a.seen||"")));
    const m = new Map(roles.map(r=>[r, score(r,P,Lr,now)]));
    return roles.slice().sort((a,b)=>m.get(b).score-m.get(a).score).map(r=>{ r._rk = m.get(r); return r; });
  }
  return {CHIPS, MAJORS, majorList, relatedChips, otherChips, suggestExclude, roleChips, isHidden, split, score, learn, decay, sortRoles, words, has, norm};
})();
/* RANK-END */

<script id="csvjs">
/* CSV-BEGIN: tracking list export / import; elm/tests/test_rank.mjs evaluates this block. */
const Csv = (function(){
  const COLS = ["id","company","title","location","url","stage","note","next","added"], STAGES = ["saved","applied","interview","offer","closed"];
  const esc = v => { let t = String(v==null?"":v); if(/^[=+\-@\t\r]/.test(t)) t = "'"+t; return /[",\n\r]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
  const toCsv = list => [COLS.join(","), ...list.map(e=>COLS.map(c=>esc(e[c])).join(","))].join("\r\n")+"\r\n";
  function parse(text){
    const rows = []; let row = [], cell = "", q = false;
    for(let i=0;i<text.length;i++){
      const ch = text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
      else if(ch==='"') q = true;
      else if(ch===","){ row.push(cell); cell=""; }
      else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cell); cell=""; rows.push(row); row=[]; }
      else cell+=ch;
    }
    if(cell||row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.some(c=>c!==""));
  }
  const unesc = t => /^'[=+\-@\t\r]/.test(t) ? t.slice(1) : t;
  const okUrl = u => { try{ const x = new URL(u); return x.protocol==="https:" ? x.href : ""; }catch(e){ return ""; } };
  function fromCsv(text){
    const rows = parse(String(text||"").replace(/^\uFEFF/,"")); if(rows.length<2) return [];
    const head = rows[0].map(h=>h.trim().toLowerCase()), out = [];
    for(const r of rows.slice(1,501)){
      const o = {}; head.forEach((h,i)=>{ if(COLS.includes(h)) o[h] = unesc(r[i]||""); });
      if(!o.id||o.id.length>80||!o.title) continue;
      out.push({id:o.id, company:(o.company||"").slice(0,160), title:o.title.slice(0,160), location:(o.location||"").slice(0,100), url:okUrl(o.url||""),
        stage:STAGES.includes(o.stage)?o.stage:"saved", note:(o.note||"").slice(0,300), next:/^\d{4}-\d{2}-\d{2}$/.test(o.next||"")?o.next:"", added:/^\d{4}-\d{2}-\d{2}$/.test(o.added||"")?o.added:"", gone:false});
    }
    return out;
  }
  return {toCsv, fromCsv, esc, parse, STAGES};
})();
/* CSV-END */
</script>

function roleCard(r){

  if(r.tier==="startup") m.append(el("span","chip startup",t.startup));
  if(r.source==="found"){ const f=el("span","chip found",t.foundBadge); f.title=t.foundLegend; m.append(f); }

let seq=0, rolesTotal=null;
async function load(reset){
  const my=++seq, p=new URLSearchParams({limit:"200"});

  ["sponsor_only","startup_only","us_only","mba"].forEach(k=>{ if(F[k]) p.set(k,"true"); });
  try{
    let got=[], tot=1;
    for(let off=0; off<tot && off<1000; off+=200){
      p.set("offset",String(off)); const r=await fetch("/api/roles?"+p); if(!r.ok) throw 0; const d=await r.json(); if(my!==seq) return;
      tot=d.total; got=got.concat(d.roles); if(!d.roles.length) break;

    all=got; shown=12; rolesTotal=tot; render();
