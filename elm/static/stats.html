<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mika Job Dashboard: stats</title><link rel="icon" href="/mika-icon.png" type="image/png">
<style>
:root{
  --bg:#F7F9FD; --surface:#FFFFFF; --surface-2:#EEF3FA; --line:#D8E0EC;
  --ink:#12203A; --ink-2:#3E4C66; --ink-3:#55627A;
  --accent:#0F4D92; --sable:#E8A33D; --sable-soft:#FFF3DC;
  --acad:#1757B8; --acad-bg:#E4EEFD; --rec:#C4500F; --rec-bg:#FFEBDD; --camp:#0E8355; --camp-bg:#DFF6EA;
  --warn:#C0271A; --warn-bg:#FFE9E6;
  --display:"Yale 2024","YaleNew",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgba(18,32,58,.06),0 8px 22px rgba(18,32,58,.07);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--sable);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--ink-3);font-size:14px}
h2{font:700 21px/1.2 var(--display);margin:0}
.bar{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#0F4D92,#286DC0);color:#fff;box-shadow:var(--shadow)}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.logo{font:700 24px/1.1 var(--display)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{white-space:nowrap;border:0;background:none;color:#fff;opacity:.8;font-weight:650;padding:8px 14px;border-radius:999px}
.nav button[aria-selected="true"]{background:rgba(255,255,255,.2);opacity:1}
.sp-fill{flex:1}
.bar .lang{border:1.5px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:6px 14px;font-weight:650;white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.btn{display:inline-block;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:8px 16px;font-weight:650;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.num{font:700 30px/1 var(--display);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:14.5px} td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)} td.n,th.n{text-align:right}
.bar2{height:8px;border-radius:4px;background:var(--acad-bg);margin-top:3px}.bar2 i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.logo{display:flex;align-items:center;gap:8px} .logo img{width:42px;height:42px;object-fit:contain}
</style></head><body>
<header class="bar"><div class="bar-in"><div class="logo"><img src="/mika/sit.webp" alt=""><span>Mika Job Dashboard</span></div><div class="sp-fill"></div>
<a class="lang" id="back" href="/" style="text-decoration:none"></a><button type="button" class="lang" id="lang"></button></div></header>
<main class="wrap"><h2 id="title"></h2><p class="lead" id="lead"></p><div id="out"></div></main>
<script>
const T={en:{title:"Stats",lead:"Counts only. No address, no one's record, no text anyone typed.",back:"Back to jobs",visits:"Visits per day",day:"Day",v:"Visits",u:"Unique visitors",s:"Searches",
 chips:"Roles people look for",kinds:"Internship or full-time",groups:"Major groups",signals:"Likes, hides, apply clicks",up:"Likes",down:"Hides",apply:"Apply clicks",tracking:"Tracked applications by stage",
 pool:"Roles found by students (public pool)",searches:"Searches in total",reqs:"Requests for roles we did not have",words:"Most common words in requests",tok:"Model use per day",dol:"Dollars today",of:"of",
 crawl:"Latest crawl",boards:"Boards read",roles:"Roles",finished:"Finished",none:"Nothing yet",err:"Could not load the stats.",kind:"Kind",calls:"Calls",inp:"Input tokens",out:"Output tokens",usd:"Dollars",
 k:{intern:"Internship",entry:"Full-time",both:"Both"},g:{comp:"Computing & data",eng:"Engineering",sci:"Sciences",soc:"Social sciences & policy",hum:"Humanities & arts",other:"Other (typed majors count here)"},
 st:{saved:"Saved",applied:"Applied",interview:"Interview",offer:"Offer",closed:"Closed"}},
 zh:{title:"统计",lead:"只有计数。没有地址，没有个人记录，也没有任何人输入的文字。",back:"返回职位",visits:"每日访问",day:"日期",v:"访问",u:"独立访客",s:"搜索",
 chips:"大家想找的岗位",kinds:"实习或全职",groups:"专业大类",signals:"点赞、隐藏、申请点击",up:"点赞",down:"隐藏",apply:"申请点击",tracking:"按阶段统计的申请跟踪",
 pool:"学生找到的职位（公共池）",searches:"搜索总数",reqs:"我们没有的职位的请求数",words:"请求中最常见的词",tok:"每日模型用量",dol:"今日花费（美元）",of:"预算",
 crawl:"最近一次抓取",boards:"已读招聘页",roles:"职位",finished:"完成于",none:"暂无",err:"统计加载失败。",kind:"类别",calls:"调用",inp:"输入 token",out:"输出 token",usd:"美元",
 k:{intern:"实习",entry:"全职",both:"都可以"},g:{comp:"计算机与数据",eng:"工程",sci:"理科",soc:"社科与政策",hum:"人文与艺术",other:"其他（自填专业计入此项）"},
 st:{saved:"已收藏",applied:"已申请",interview:"面试",offer:"录用",closed:"已结束"}}};
let lang=(()=>{try{const s=localStorage.getItem("elm-lang");if(s==="en"||s==="zh")return s}catch(e){}return (navigator.language||"").startsWith("zh")?"zh":"en"})(), D=null;
const $=id=>document.getElementById(id), el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function table(heads,rows){const t=el("table"),h=el("tr");heads.forEach((x,i)=>h.append(el("th",i?"n":"",x)));t.append(h);rows.forEach(r=>{const tr=el("tr");r.forEach((x,i)=>tr.append(el("td",i?"n":"",String(x))));t.append(tr)});return t}
function bars(obj,fmt,tx){const box=el("div");const e=Object.entries(obj||{});if(!e.length)box.append(el("p","muted",tx.none));const m=Math.max(1,...e.map(x=>x[1]));
 e.slice(0,12).forEach(([k,v])=>{const r=el("div");r.append(el("span",null,(fmt?fmt(k):k)+" · "+v));const b=el("div","bar2"),i=el("i");i.style.width=(100*v/m)+"%";b.append(i);r.append(b);box.append(r)});return box}
function card(title,node,big){const c=el("div","card");c.append(el("h2",null,title));if(big!=null)c.append(el("div","num",big));if(node)c.append(node);return c}
function draw(){const t=T[lang];document.documentElement.lang=lang;$("title").textContent=t.title;$("lead").textContent=t.lead;$("back").textContent=t.back;$("lang").textContent=lang==="en"?"中文":"English";
 const o=$("out");o.textContent="";if(!D){o.append(el("div","card",t.err));return}
 o.append(card(t.visits,D.per_day.length?table([t.day,t.v,t.u,t.s],D.per_day.slice().reverse().map(d=>[d.day,d.visits,d.uniques,d.searches])):el("p","muted",t.none)));
 const g=el("div","grid");
 g.append(card(t.chips,bars(D.chips,k=>k,t)),card(t.kinds,bars(D.kinds,k=>t.k[k]||k,t)),card(t.groups,bars(D.groups,k=>t.g[k]||k,t)),card(t.tracking,bars(D.tracking,k=>t.st[k]||k,t)));
 const sg=D.signals;g.append(card(t.signals,table([t.kind,"#"],[[t.up,sg.up],[t.down,sg.down],[t.apply,sg.apply]])),card(t.pool,null,D.pool_size),card(t.searches,null,D.searches_total),card(t.reqs,bars(Object.fromEntries(D.request_words),null,t),D.requests));
 o.append(g);
 const days=Object.keys(D.usage).reverse(),rows=[];days.forEach(d=>Object.entries(D.usage[d]).forEach(([k,v])=>{if(k!=="_dollars")rows.push([d,k,v.calls,v.input,v.output])}));
 const tk=card(t.tok,rows.length?table([t.day,t.kind,t.calls,t.inp,t.out],rows):el("p","muted",t.none));tk.append(el("p","muted",t.dol+": $"+D.dollars_today+" "+t.of+" $"+D.dollar_budget));o.append(tk);
 if(D.crawl)o.append(card(t.crawl,table([t.boards,t.roles,t.finished],[[D.crawl.boards_ok+"/"+D.crawl.boards,D.crawl.roles,String(D.crawl.finished||"").slice(0,16)]])))}
$("lang").onclick=()=>{lang=lang==="en"?"zh":"en";try{localStorage.setItem("elm-lang",lang)}catch(e){}draw()};
fetch("/stats?format=json").then(r=>r.json()).then(d=>{D=d;draw()}).catch(()=>draw());draw();
</script></body></html>
